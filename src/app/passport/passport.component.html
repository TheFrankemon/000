<h1 class="passport-title">Passport ➜</h1>

<div class="passport-item-container">
  <div
    *ngFor="let item of categories"
    class="passport-item"
    [class.disabled]="item.locked"
  >
    <div class="passport-item-content"
      [ngStyle]="{'background-image': 'url(\'assets/passport/'+ item.bgImage + '\')'}"
      [routerLink]="[item.route]"
    >
      <h3>{{item.name}}</h3>
    </div>
    <div *ngIf="item.locked" class="under-construction">
      <span>事中 - UNDER CONSTRUCTION - 工事中 - UNDER CONSTRUCTION</span>
    </div>
  </div>
</div>
